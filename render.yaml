# ITVLive v2 — Render.com blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: itvlive-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: ENABLE_TEST_DJ
        value: "false"
